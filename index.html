<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe Pro</title>
    <link href="style.css" rel="stylesheet" />
    <script type="module" src="src/main.js" defer></script>
  </head>
  <body class="dark">
    <div class="app-shell">
      <aside class="nav-rail" id="main-sidebar">
        <div class="rail-group top">
          <button class="rail-item" id="sidebar-toggle" title="Menü umschalten">
            <span class="rail-icon">☰</span>
            <span class="rail-label">Menü</span>
          </button>

          <button
            class="rail-item"
            id="open-settings-btn"
            title="Spiel-Einstellungen"
          >
            <span class="rail-icon">⚙️</span>
            <span class="rail-label">Lobby</span>
          </button>

          <div class="sidebar-divider"></div>
          <div id="player-list-ui" class="player-stack"></div>
        </div>

        <div class="rail-group bottom">
          <button
            class="rail-item"
            id="open-profile-btn"
            title="Profil & Design"
          >
            <span class="rail-icon">👤</span>
            <span class="rail-label">Profil</span>
          </button>
        </div>
      </aside>

      <main class="game-view">
        <header class="game-header">
          <h1>Tic-Tac-Toe</h1>
          <div class="status-container">
            <p id="turnplayerlabel">Current Turn:</p>
            <p id="turnnumlabel">Turn Number:</p>
          </div>
          <p id="winnerLabel" class="victory-message"></p>
        </header>

        <div class="grid-container">
          <div class="grid" id="grid"></div>
        </div>

        <footer class="game-footer">
          <button id="reset" class="reset-btn">Zurücksetzen</button>
        </footer>

        <button
          id="chat-toggle-btn"
          class="chat-toggle-btn"
          title="Chat öffnen"
        >
          💬
        </button>
      </main>

<aside class="chat-drawer" id="chat-sidebar">
  <div class="drawer-header">
    <span>Chat</span>
  </div>

  <div id="chat-messages" class="chat-content"></div>

  <div class="chat-input-area">
    <label for="nachricht" class="visually-hidden">Nachricht!</label>

    <textarea
      id="nachricht"
      name="nachricht"
      rows="1"
      placeholder="Schreibe eine Nachricht..."
      class="input-like"></textarea>

    <button id="chat-send">Senden</button>
  </div>
</aside>
        <dialog id="lobby-dialog" class="custom-modal">
      <div class="modal-content">
        <h2>Lobby Einstellungen</h2>
        <div class="form-group">
          <label for="mode">Spielmodus</label
          ><select id="mode"></select>
        </div>
        <div class="form-group">
          <label for="difficulty" id="difficulty-label">Schwierigkeit</label>
          <select id="difficulty">
            <option value="easy">Einfach</option>
            <option value="medium" selected>Normal</option>
            <option value="hard">Schwer</option>
          </select>
        </div>
        <div class="form-group">
          <label for="boardsize">Spielfeldgröße</label
          ><input type="number" id="boardsize" min="3" max="10" value="3" />
        </div>
        <div class="form-group">
          <label for="wincon">Gewinnbedingung</label
          ><input type="number" id="wincon" min="3" max="10" value="3" />
        </div>
        <div class="modal-actions">
          <button id="apply" class="primary-btn">Übernehmen</button>
          <button id="close-lobby-btn" class="close-btn">Abbrechen</button>
        </div>
      </div>
    </dialog>

    <dialog id="profile-dialog" class="custom-modal">
      <div class="modal-content">
        <h2>Personalisierung</h2>
        <div class="form-group">
          <label for="colors">Farbschema wählen</label
          ><select id="colors"></select>
        </div>
        <div class="modal-actions">
          <button id="close-profile-btn" class="primary-btn">Speichern</button>
        </div>
      </div>
    </dialog>
  </body>
</html>
