<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link href="style.css" rel="stylesheet" />
    <script type="module" src="src/main.ts" defer></script>
  </head>
 <body>
  <header>


<div class="right">
  <label for="colors">Farbschema</label>
  <select id="colors">
  </select>
</div>

  <div>
  <label for="mode">Spielmodus</label>
   <select id="mode">
  </select>

  <label for="difficulty" id="difficulty-label">Schwierigkeit</label>
  <select id="difficulty">
  <option value="easy">Einfach</option>
  <option value="medium" selected>Normal</option>
  <option value="hard">Schwer</option>
  </select>
  </div>

  <div>
  <label for="boardsize">Spielfeldgröße</label>
  <input type="number" id="boardsize" min="3" max="10" value="3" />
  </div>


  <div>
  <label for="wincon">Gewinnbedingung</label>
  <input type="number" id="wincon" min="3" max="10" value="3" />
  </div>

  <br>
  <button id="apply">Übernehmen</button>
  </header>


<div class="top">
  <h1>Tic-Tac-Toe</h1>
  <p id="turnplayerlabel">Current Turn:</p>
  <p id="turnnumlabel">Turn Number:</p>
  <p id="winnerLabel"></p>
</div>
<div class="grid" id="grid"></div>
<button id="reset">Reset</button>
</html>
